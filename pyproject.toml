[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aead"
version = "0.1.0"
description = "Autoencoder-based anomaly detection for industrial visual inspection: ConvAE, VAE and MemAE with ONNX/OpenVINO deployment and a REST API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam (Islam) Elmenyawy", email = "eslamelmenyawy1988@gmail.com" }]
keywords = ["anomaly-detection", "autoencoder", "computer-vision", "visual-inspection",
            "pytorch", "onnx", "openvino"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
# Core deps are enough to run an exported ONNX model.
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "pyyaml>=6.0"]

[project.optional-dependencies]
train = ["torch>=2.1", "scikit-learn>=1.3", "matplotlib>=3.7", "onnx>=1.15",
         "onnxruntime>=1.17"]
serve = ["onnxruntime>=1.17", "fastapi>=0.110", "uvicorn[standard]>=0.29",
         "python-multipart>=0.0.9"]
openvino = ["openvino>=2024.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
aead = "aead.cli:main"

[project.urls]
Repository = "https://github.com/eslamelmenyawy/autoencoder-anomaly-detection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's File(...) / Query(...) defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
